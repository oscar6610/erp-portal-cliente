{% extends "portal/base.html" %}
{% block title %}Registro — Portal del Cliente{% endblock %}

{% block content %}
<h1>Crear mi cuenta</h1>

<form method="post" class="tarjeta">
  {% csrf_token %}
  {% if error %}<div class="aviso">{{ error }}</div>{% endif %}

  <label for="rut">RUT</label>
  <input type="text" id="rut" name="rut" placeholder="12345678-9" required>

  <label for="nombre">Nombre completo</label>
  <input type="text" id="nombre" name="nombre" required>

  <label for="correo">Correo electrónico</label>
  <input type="email" id="correo" name="correo" required>

  <label for="telefono">Teléfono</label>
  <input type="text" id="telefono" name="telefono">

  <label for="direccion">Dirección de despacho</label>
  <input type="text" id="direccion" name="direccion">

  <label for="password">Contraseña</label>
  <input type="password" id="password" name="password" required>

  <button class="primary" type="submit">Registrarme</button>

  <p class="pie">¿Ya tienes cuenta? <a href="{% url 'portal:login' %}">Ingresa</a></p>
</form>
{% endblock %}
